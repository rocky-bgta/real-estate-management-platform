spring:
  application:
    name: real-estate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/real_estate}
    username: ${POSTGRES_USER:real_estate}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
